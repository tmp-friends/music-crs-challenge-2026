[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcrs"
version = "0.1.0"
authors = [
    { name = "Music CRS Baselines Team" },
]
description = "Music Conversational Recommender System Baselines"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "bm25s>=0.2.13",
    "datasets>=3.1.0",
    "lightgbm>=4.0.0",
    "omegaconf>=2.3.0",
    "psutil>=7.2.2",
    "torch>=2.5.1,<2.7",
    "torchaudio>=2.5.1,<2.7",
    "torchvision>=0.20.1,<0.22",
    "transformers>=4.51.0",
]

[project.optional-dependencies]
eda = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.0",
    "nbclient>=0.10.0",
    "nbformat>=5.10.0",
    "numpy>=2.2.0",
    "pandas>=2.3.0",
    "pyarrow>=24.0.0",
    "seaborn>=0.13.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchaudio = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]

[tool.setuptools.packages.find]
include = ["mcrs*"]

[tool.setuptools.package-data]
"*" = [
    "system_prompts/*.txt",
    "experiments/**/*.md",
    "experiments/**/*.yaml",
    "experiments/**/*.csv",
    "experiments/**/*.json",
    "experiments/**/*.jsonl",
    "experiments/**/*.parquet",
]
